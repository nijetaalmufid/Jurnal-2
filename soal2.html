<!DOCTYPE html>
<html>
<head>
  <title>Tabel Biru Hijau</title>
</head>
<body>

<table border="1" bordercolor="white" cellspacing="2" cellpadding="0" bgcolor="white">

  <!-- Baris 1 -->
  <tr>
    <td rowspan="7" width="108" bgcolor="blue"></td>
    <td colspan="3" height="108" bgcolor="blue"></td>
  </tr>

  <!-- Baris 2 -->
  <tr>
    <td width="108" height="108" bgcolor="lime"></td>
    <td colspan="2" rowspan="2" width="220" bgcolor="lime"></td>
    <td rowspan="2" width="108" bgcolor="blue"></td>
  </tr>

  <!-- Baris 3 -->
  <tr>
    <td height="108" bgcolor="white"></td>
  </tr>

  <!-- Baris 4 -->
  <tr>
    <td height="108" bgcolor="blue"></td>
    <td bgcolor="white"></td>
    <td bgcolor="blue"></td>
  </tr>

  <!-- Baris 5 -->
  <tr>
    <td colspan="4" height="108" bgcolor="white"></td>
  </tr>

  <!-- Baris 6 -->
  <tr>
    <td colspan="4" height="108" bgcolor="white"></td>
  </tr>

  <!-- Baris 7 -->
  <tr>
    <td colspan="4" height="108" bgcolor="white"></td>
  </tr>

</table>

</body>
</html>
